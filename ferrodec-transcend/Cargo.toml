[package]
name = "ferrodec-transcend"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared correctly-rounded Extended-precision transcendental kernel for the ferrodec decimal family"
repository.workspace = true
keywords = ["decimal", "transcendental", "no_std", "embedded", "ieee754"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
# Feature names and the implication graph mirror the core `ferrodec`
# crate verbatim, so a sibling can forward its own `trig` / `exp-log`
# / `hyperbolic` / `pow` / `transcendentals` selection 1:1 without any
# feature-translation glue. `fmt` is retained for parity even though
# the kernel parses constants through `Extended::parse_str`
# unconditionally; keeping the name aligned avoids a translation seam.
default = []
fmt = []
trig = ["fmt"]
exp-log = ["fmt"]
hyperbolic = ["exp-log"]
pow = ["exp-log"]
# The pi-scaled family (ADR-0061). Deliberately standalone: exact
# decimal argument reduction means it needs none of `trig`'s Payne-
# Hanek machinery, so revolutions-based users (the family's dominant
# real use) pay for no reduction tables.
trig-pi = ["fmt"]
transcendentals = ["trig", "exp-log", "hyperbolic", "pow", "trig-pi"]
# The unbounded rung of the ADR-0059 escalation ladder (M8b): a working
# type whose precision is chosen at run time, on the growable `DecBig`
# substrate. Off by default and orthogonal to the kernel selection
# above, because it is the one part of this crate that allocates —
# a Cortex-M0+ build keeps the fixed rungs and never sees a heap.
unbounded-ladder = ["ferrodec-multiword/alloc"]

[dependencies]
ferrodec-ieee = { path = "../ferrodec-ieee", version = "0.1.4" }
ferrodec-multiword = { path = "../ferrodec-multiword", version = "0.2.0" }

[dev-dependencies]
proptest = "1"
astro-float = "0.9"
ferrodec-test-support = { path = "../ferrodec-test-support" }

[lints]
workspace = true

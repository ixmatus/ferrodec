name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- Test matrix on Linux + macOS, default + feature combos ----------
  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""                                          # default features (fmt)
          - "--no-default-features"
          - "--features transcendentals"
          - "--features binary-float"
          - "--features transcendentals,binary-float"
          - "--features serde,ops,num-traits"           # ecosystem trio (1.4-1.5 surface)
          - "--all-features"                            # everything at once
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build ${{ matrix.features }} --verbose

      - name: cargo test
        run: cargo test ${{ matrix.features }} --verbose

  # ---------- Conformance (decTest vectors) ----------
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features=transcendentals --test conformance -- --nocapture

  # ---------- MSRV check (1.84) ----------
  msrv:
    name: MSRV (1.84)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --verbose

  # ---------- Cross-compile to thumbv6m (Cortex-M0+ floor) ----------
  thumbv6m:
    name: cross-compile (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fmt --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=transcendentals --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=transcendentals,binary-float --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fmt,serde,ops,num-traits --verbose
      - run: cargo build --target thumbv6m-none-eabi --all-features --verbose

  # ---------- Format / lint ----------
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # ---------- Kani proof ----------
  kani:
    name: kani harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: model-checking/kani-github-action@v1.1
      - run: cargo kani --features=transcendentals
      - run: cargo kani --package ferrodec-decimal32 --features=fmt

  # ---------- ferrodec-decimal32 (sibling crate, in development) ----------
  decimal32:
    name: ferrodec-decimal32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-decimal32 --verbose
      - run: cargo build --package ferrodec-decimal32 --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal32 --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --all-features --verbose
      - run: cargo clippy --package ferrodec-decimal32 --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-decimal32 --features=fmt --test conformance -- --nocapture
      - run: cargo test --package ferrodec-decimal32 --features=transcendentals --verbose

  # ---------- ferrodec-decimal64 (sibling crate, in development) ----------
  decimal64:
    name: ferrodec-decimal64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-decimal64 --verbose
      - run: cargo build --package ferrodec-decimal64 --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --all-features --verbose
      - run: cargo clippy --package ferrodec-decimal64 --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-decimal64 --features=fmt --test conformance -- --nocapture

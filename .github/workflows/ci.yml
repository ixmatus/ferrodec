name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- Test matrix on Linux + macOS, default + feature combos ----------
  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""                                          # default features (fmt)
          - "--no-default-features"
          - "--features transcendentals"
          - "--features binary-float"
          - "--features transcendentals,binary-float"
          - "--features serde,ops,num-traits"           # ecosystem trio (1.4-1.5 surface)
          - "--all-features"                            # everything at once
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build ${{ matrix.features }} --verbose

      - name: cargo test
        run: cargo test ${{ matrix.features }} --verbose

  # ---------- Conformance (decTest vectors) ----------
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features=transcendentals --test conformance -- --nocapture

  # ---------- MSRV check (1.84) ----------
  msrv:
    name: MSRV (1.84)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --verbose

  # ---------- Cross-compile to thumbv6m (Cortex-M0+ floor) ----------
  thumbv6m:
    name: cross-compile (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fmt --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=transcendentals --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=transcendentals,binary-float --verbose
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features=fmt,serde,ops,num-traits --verbose
      - run: cargo build --target thumbv6m-none-eabi --all-features --verbose

  # ---------- Format / lint ----------
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # ---------- Kani proof ----------
  kani:
    name: kani harnesses
    runs-on: ubuntu-latest
    # The whole job took 66 to 81 minutes on main in August 2026, 22 to
    # 43 of them in the action's own redundant run (now a no-op, see
    # below); a proof that does not terminate must fail in hours, not
    # consume GitHub's six hour default (the first run on
    # review-2026-10 did exactly that).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Pin the Kani the local battery proves with (`cargo kani --version`
      # at the Phase 0 tip of the 2026-10 review). The action's default is
      # `latest`, which floated to 0.68.0 (released 2026-09-16) after the
      # last green run; under 0.68.0 a proving run named its first
      # harness on 2026-10-09 and printed nothing more for six hours,
      # where 0.67.0 proves the same harness in 3 to 7 seconds.
      # Receipts: docs/archive/review-2026-10/reproducers/CI-kani-0.68/.
      # Bump deliberately, after the battery passes locally with the new
      # version.
      #
      # The action does not only install: its last step runs
      # `cargo-kani <args>`. With no arguments that was a full proving
      # run of the root crate's default feature harnesses, 84 of them in
      # 22 to 43 runner minutes, every one of which the explicit root
      # invocation below proves again among its 90 (the same names, and
      # no `cfg(not(feature))` item exists in the crates they reach).
      # `--version` makes the action's own run a no-op (fd-e8a9.44); the
      # four invocations below are the proofs, the same four the
      # battery's kani lane runs.
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.67.0"
          args: "--version"
      - run: cargo kani --package ferrodec-ieee
      # The dpd feature gates the DPD codec harnesses on the root and
      # decimal64 crates; without it those proofs never ran in CI (fd-aqs.9).
      - run: cargo kani --features=transcendentals,dpd
      - run: cargo kani --package ferrodec-decimal32 --features=fmt,dpd
      - run: cargo kani --package ferrodec-decimal64 --features=transcendentals,dpd

  # ---------- ferrodec-ieee (shared metadata crate) ----------
  ieee:
    name: ferrodec-ieee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-ieee --verbose
      - run: cargo build --package ferrodec-ieee --target thumbv6m-none-eabi --verbose
      - run: cargo clippy --package ferrodec-ieee --all-targets -- -D warnings
      - run: cargo test --package ferrodec-ieee --verbose

  # ---------- ferrodec-multiword (shared multiword-integer crate) ----------
  multiword:
    name: ferrodec-multiword
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-multiword --verbose
      - run: cargo build --package ferrodec-multiword --all-features --verbose
      - run: cargo build --package ferrodec-multiword --target thumbv6m-none-eabi --verbose
      - run: cargo clippy --package ferrodec-multiword --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-multiword --all-features --verbose

  # ---------- ferrodec-transcend (shared 50-digit kernel) ----------
  transcend:
    name: ferrodec-transcend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-transcend --verbose
      - run: cargo build --package ferrodec-transcend --all-features --verbose
      - run: cargo clippy --package ferrodec-transcend --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-transcend --all-features --verbose

  # ---------- ferrodec-decimal (arbitrary-precision crate) ----------
  decimal:
    name: ferrodec-decimal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-decimal --verbose
      - run: cargo build --package ferrodec-decimal --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal --all-features --verbose
      - run: cargo build --package ferrodec-decimal --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo clippy --package ferrodec-decimal --all-features --all-targets -- -D warnings
      # Runs the 27k-vector decTest conformance suite, the vendored-corpus
      # integrity hashes, and the unit/property suites (fd-aqs.9: this
      # crate previously had no CI lane at all).
      - run: cargo test --package ferrodec-decimal --all-features --verbose

  # ---------- ferrodec-test-support (workspace-internal dev crate) ----------
  test_support:
    name: ferrodec-test-support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-test-support --verbose
      - run: cargo clippy --package ferrodec-test-support --all-targets -- -D warnings
      - run: cargo test --package ferrodec-test-support --verbose

  # ---------- ferrodec-decimal32 (sibling crate, in development) ----------
  decimal32:
    name: ferrodec-decimal32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-decimal32 --verbose
      - run: cargo build --package ferrodec-decimal32 --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal32 --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal32 --target thumbv6m-none-eabi --all-features --verbose
      - run: cargo clippy --package ferrodec-decimal32 --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-decimal32 --features=fmt --test conformance -- --nocapture
      - run: cargo test --package ferrodec-decimal32 --features=transcendentals --verbose

  # ---------- ferrodec-decimal64 (sibling crate, in development) ----------
  decimal64:
    name: ferrodec-decimal64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package ferrodec-decimal64 --verbose
      - run: cargo build --package ferrodec-decimal64 --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal64 --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal64 --features=serde,ops,num-traits --verbose
      - run: cargo build --package ferrodec-decimal64 --all-features --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --no-default-features --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --features=transcendentals --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --features=fmt,serde,ops,num-traits --verbose
      - run: cargo build --package ferrodec-decimal64 --target thumbv6m-none-eabi --all-features --verbose
      - run: cargo clippy --package ferrodec-decimal64 --all-features --all-targets -- -D warnings
      - run: cargo test --package ferrodec-decimal64 --features=fmt --test conformance -- --nocapture
      - run: cargo test --package ferrodec-decimal64 --features=transcendentals --verbose
      - run: cargo test --package ferrodec-decimal64 --all-features --verbose

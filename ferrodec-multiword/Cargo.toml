[package]
name = "ferrodec-multiword"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fixed-width 256/384/512-bit unsigned integer primitives for the ferrodec decimal family"
repository.workspace = true
keywords = ["bigint", "u256", "no_std", "embedded", "decimal"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
# Off by default: the fixed-width U256/U384/U512 types stay strictly
# no-alloc for the Cortex-M0+ floor. Enabling `alloc` compiles in the
# growable base-10^9 decimal-limb integer `DecBig` (the coefficient
# backend for the arbitrary-precision `ferrodec-decimal` crate), which
# needs heap storage. The fixed-width types are unaffected either way.
default = []
alloc = []

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decbig_ops"
harness = false
required-features = ["alloc"]

[lints]
workspace = true

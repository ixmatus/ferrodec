[package]
name = "ferrodec"
version = "0.0.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
description = "no_std IEEE 754-2019 Decimal128 for embedded use, with Kani-verified properties"
repository = "https://github.com/ixmatus/ferrodec"
keywords = ["decimal", "ieee754", "no_std", "embedded", "decimal128"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
default = ["fmt"]
# String parse + format. Uses core::fmt::Write, no alloc.
fmt = []
# exp / log / sin / cos / pow. Code-size cost; opt-in. Pulls in `fmt`
# because the constants are loaded via `parse_str`.
transcendentals = ["fmt"]
# f32 / f64 conversions. Opt-in for soft-float-only targets.
# Pulls in `fmt` because the conversion routes Decimal128 ↔ f64 via
# the canonical decimal-string round-trip.
binary-float = ["fmt"]
# Compile Kani proof harnesses. Off in normal builds.
kani = []

[dev-dependencies]
proptest = "1"
astro-float = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we explicitly allow:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[[bench]]
name = "core_ops"
harness = false

[[bench]]
name = "transcendentals"
harness = false
required-features = ["transcendentals"]

[[bench]]
name = "conversions"
harness = false
required-features = ["fmt"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1

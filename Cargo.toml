[workspace]
members = [".", "ferrodec-decimal32", "ferrodec-decimal64", "ferrodec-ieee", "ferrodec-multiword", "ferrodec-transcend", "ferrodec-test-support"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ixmatus/ferrodec"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we explicitly allow. Two categories:
#
# 1. Cast lints — IEEE/BID arithmetic does width-shrinking and
#    sign-changing casts deliberately, with bounds maintained by the
#    surrounding logic. Letting clippy fight them adds noise.
# 2. Style lints that disagree with the kernel's needs:
#    - `match_same_arms` for IEEE classification dispatches that
#      *deliberately* enumerate every Class variant for clarity, even
#      when adjacent arms share a body.
#    - `similar_names` flags `lo` vs. `lo_lo`, `mid` vs. `mid_lo` etc.
#      in the multi-word arithmetic; those names are semantically
#      precise.
#    - `float_cmp` — sometimes the right test (e.g. checking f64 == 0.0
#      to detect underflow exactly).
#    - `unreadable_literal` — some constants are clearer without
#      digit-separator clutter (e.g. bit masks, error code values).
#    - The various "too many" / "single char" counts — math kernels
#      legitimately have wide operand surfaces and short symbolic names.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
match_same_arms = "allow"
similar_names = "allow"
float_cmp = "allow"
single_match_else = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
assertions_on_constants = "allow"
trivially_copy_pass_by_ref = "allow"
fn_params_excessive_bools = "allow"
should_implement_trait = "allow"
manual_let_else = "allow"
enum_variant_names = "allow"
missing_panics_doc = "allow"

[package]
name = "ferrodec"
version = "1.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "no_std IEEE 754-2019 Decimal128 for embedded use, with Kani-verified properties"
repository.workspace = true
keywords = ["decimal", "ieee754", "no_std", "embedded", "decimal128"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
default = ["fmt"]
# String parse + format. Uses core::fmt::Write, no alloc.
fmt = []
# Transcendental sub-features. Pick the cluster you need; embedded
# users on flash-tight targets can save the 6 300-digit Payne-Hanek
# table (under `trig`) plus per-kernel Taylor / Newton bodies they
# don't call. All of them pull in `fmt` because the constants and
# property tests round-trip through `parse_str`.
#
# `trig`        — sin, cos, tan, asin, acos, atan, atan2.
# `exp-log`     — exp, exp2, ln, log2, log10, cbrt.
# `hyperbolic`  — sinh, cosh, tanh, asinh, acosh, atanh. Implies
#                 `exp-log` because the kernels delegate to exp / ln.
# `pow`         — pow. Implies `exp-log` (`pow(x, y) = exp(y · ln x)`).
#
# Forwards to `ferrodec-transcend/trig` so the shared Payne-Hanek
# argument-reduction kernel (gated there under the same name) is
# compiled in when the core shim delegates to it.
trig = ["fmt", "ferrodec-transcend/trig"]
# Forwards to `ferrodec-transcend/exp-log` so the shared exp / ln /
# cbrt kernel modules (gated there under the same name) are compiled
# in when the core shim delegates to them.
exp-log = ["fmt", "ferrodec-transcend/exp-log"]
hyperbolic = ["exp-log", "ferrodec-transcend/hyperbolic"]
pow = ["exp-log", "ferrodec-transcend/pow"]
# Convenience meta-feature: enable every transcendental at once. The
# pre-1.2 `transcendentals = ["fmt"]` shape carried the same effect,
# so existing dependents that ask for `transcendentals` see no change.
transcendentals = ["trig", "exp-log", "hyperbolic", "pow"]
# f32 / f64 conversions. Opt-in for soft-float-only targets.
# Pulls in `fmt` because the conversion routes Decimal128 ↔ f64 via
# the canonical decimal-string round-trip.
binary-float = ["fmt"]
# `core::ops` operator overloads (Add / Sub / Mul / Div / Rem and the
# *Assign variants). Opt-in: defaults to RoundingMode::NearestEven and
# drops the per-operation Status. Users who need explicit rounding-
# mode or status control should keep using the explicit `add` /
# `sub` / `mul` / `div` / `rem` methods. See the README's "Why no
# core::ops" section for the design rationale.
ops = []
# Opt-in, local-only Python/libmpdec + mpmath differential test
# (Track 3, plan 2026-05-17; special-function surface extended under
# ADR-0026). Gates `tests/differential.rs` so the Python subprocess
# never runs in a default `cargo test` or CI. Implies
# `transcendentals` because the differential sweep exercises the whole
# transcendental surface (it always required those methods to compile;
# this makes a single `--features differential` self-contained). Still
# no extra *external* dependency; the mpmath path degrades to
# skip-with-diagnostic when mpmath is not importable.
differential = ["transcendentals"]
# Serde Serialize / Deserialize for Decimal128. Round-trips through the
# canonical decimal string by default; the `serde_bid` helper module is
# provided for callers that prefer to serialize the raw 128-bit BID
# pattern in binary formats. Pulls in `fmt` because the default
# representation goes through `parse_str` / `Display`.
serde = ["fmt", "dep:serde"]
# `num-traits` adapter: implements `Zero`, `One`, `Bounded`,
# `Signed`, `Num`, and the `From|To|Primitive` traits on Decimal128.
# `Num` requires `Add + Sub + Mul + Div + Rem`, so this feature
# auto-enables `ops`. Pulls `fmt` because `Num::from_str_radix`
# routes through `parse_str`.
num-traits = ["fmt", "ops", "dep:num-traits"]
# DPD (Densely Packed Decimal) interchange. Enables
# `Decimal128::to_dpd_bytes` and `from_dpd_bytes` for IEEE 754
# byte-pattern interchange between the BID storage encoding (used
# internally for arithmetic) and the DPD interchange encoding (used
# by IBM decNumber, z/Architecture decimal-FP hardware, and the
# upstream `dqEncode.decTest` / `dqCanonical.decTest` conformance
# vectors). The codec is pure boolean equations from IEEE 754-2008
# §3.5.2 — no lookup tables. Off by default to preserve the embedded
# code-size floor. See ADR-0001 (BID for arithmetic) and the plan at
# `docs/decisions/plans/2026-05-07-dpd-interchange.md`.
dpd = []

[dependencies]
ferrodec-ieee = { path = "ferrodec-ieee", version = "0.1.4" }
ferrodec-multiword = { path = "ferrodec-multiword", version = "0.1.0" }
ferrodec-transcend = { path = "ferrodec-transcend", version = "0.1.0" }
serde = { version = "1", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
astro-float = "0.9"
# Independent sibling (ADR-0011), dev-only: the `d128_crosscheck`
# cross-precision oracle widens finite `Decimal64` operands into
# `Decimal128` through the exact decimal string. No normal-build edge
# and no cycle (decimal64 does not depend on this crate).
ferrodec-decimal64 = { path = "ferrodec-decimal64" }
ferrodec-test-support = { path = "ferrodec-test-support", features = ["transcend-oracle"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
serde_test = "1"

[lints]
workspace = true

[[example]]
name = "money"
required-features = ["fmt"]

[[example]]
name = "rounding_modes"
required-features = ["fmt"]

[[example]]
name = "transcendentals"
required-features = ["transcendentals"]

[[bench]]
name = "core_ops"
harness = false
required-features = ["fmt"]

[[bench]]
name = "comparison"
harness = false
required-features = ["fmt"]

[[bench]]
name = "transcendentals"
harness = false
required-features = ["transcendentals"]

[[bench]]
name = "conversions"
harness = false
required-features = ["fmt"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1

[package]
name = "ferrodec-decimal32"
version = "3.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "no_std IEEE 754-2019 Decimal32 for embedded use, with Kani-verified properties"
repository.workspace = true
keywords = ["decimal", "decimal32", "ieee754", "no_std", "embedded"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
default = ["fmt"]
# String parse + format. Uses core::fmt::Write, no alloc.
fmt = []
# f64 conversions (Decimal32 ↔ f64). No alloc; routes via the canonical
# decimal-string round-trip.
binary-float = ["fmt"]
# Opt-in, local-only Python/libmpdec + mpmath differential test
# (Track 3, plan 2026-05-17; special-function surface extended under
# ADR-0026). Gates `tests/differential.rs`; the Python subprocess
# never runs in a default `cargo test` or CI. Implies
# `transcendentals` so a single `--features differential` is
# self-contained (the sweep always needed those methods to compile);
# still no extra *external* dependency, and the mpmath path degrades
# to skip-with-diagnostic when mpmath is not importable.
differential = ["transcendentals"]
# Transcendental sub-features. The whole transcendental surface
# (the exp-log family `exp` / `ln` / `exp2` / `log2` / `log10`,
# `cbrt`, the whole trig family `sin` / `cos` / `tan` / `asin` /
# `acos` / `atan` / `atan2`, the whole hyperbolic family `sinh` /
# `cosh` / `tanh` / `asinh` / `acosh` / `atanh`, and `pow`) is
# correctly rounded at every IEEE 754-2019 rounding direction via
# the shared `ferrodec-transcend` Extended-precision kernel
# (ADR-0032; supersedes ADR-0024's faithful contract), at exact
# parity with the `ferrodec` (Decimal128) parent and the
# `ferrodec-decimal64` sibling. The 50-digit Extended working
# precision exceeds the smallest empirical Arb worst-case half-ULP
# margin (`4.167e-8` for `cosh` at Decimal32, the binding case
# across the family) by more than thirty orders of magnitude on
# every format; per-function margins live in the corpus provenance
# files (`tests/vectors/transcend/<fn>.prov`) and in ADR-0032
# §Decision. The trig family uses Payne-Hanek argument reduction
# (correctly rounded across the full Decimal32 magnitude range);
# the hyperbolic family is correctly rounded across the full
# Decimal32 magnitude range up to the true overflow boundary;
# `pow` evaluates `exp(y · ln(|x|))` at Extended precision. No
# transcendental routes through f64 any more, so `libm` is no
# longer a dependency of this crate. Each sub-feature pulls in
# `binary-float`.
#
# `exp-log`:    exp, ln, exp2, log2, log10. Route through the shared
#               `ferrodec-transcend` Extended-precision kernel,
#               correctly rounded across the true Decimal32 domain
#               (ADR-0032).
# `trig`:       sin, cos, tan, asin, acos, atan, atan2. Route through
#               the shared `ferrodec-transcend` Extended-precision
#               kernel with Payne-Hanek argument reduction, correctly
#               rounded across the true Decimal32 domain (ADR-0032).
# `hyperbolic`: sinh, cosh, tanh, asinh, acosh, atanh. Route through
#               the shared `ferrodec-transcend` Extended-precision
#               kernel (built on the correctly rounded `exp` / `ln`
#               primitives), correctly rounded across the true
#               Decimal32 domain (ADR-0032). Implies `exp-log`.
# `pow`:        pow, cbrt. Route through the shared
#               `ferrodec-transcend` Extended-precision kernel,
#               correctly rounded across the true Decimal32 domain
#               (ADR-0032). Implies `exp-log`.
exp-log = ["binary-float", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/exp-log"]
trig = ["binary-float", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/trig"]
hyperbolic = ["exp-log", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/hyperbolic"]
pow = ["exp-log", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/pow"]
# Convenience meta-feature: enable every transcendental at once.
transcendentals = ["trig", "exp-log", "hyperbolic", "pow"]
# `core::ops` operator overloads (Add / Sub / Mul / Div / Rem and the
# *Assign variants, plus Neg). Opt-in: defaults to
# RoundingMode::NearestEven and drops the per-operation Status. `%`
# routes to `rem_trunc` on this format (GDA truncated, the rule the
# bare 1.x `rem` carried here) and to `rem_near` on Decimal128 (IEEE
# 754-2019 §5.3.1); ADR-0027 records the per-format choice. Users
# who need explicit rounding-mode or status control should keep using
# the explicit `add` / `sub` / `mul` / `div` / `rem_near` / `rem_trunc`
# methods.
ops = []
# Serde Serialize / Deserialize for Decimal32. Round-trips through the
# canonical decimal string by default; the `serde_bid` helper module is
# provided for callers that prefer to serialize the raw 32-bit BID
# pattern in binary formats. Pulls in `fmt` because the default
# representation goes through `parse_str` / `Display`.
serde = ["fmt", "dep:serde"]
# `num-traits` adapter: implements `Zero`, `One`, `Bounded`,
# `Signed`, `Num`, and the `From|To|Primitive` traits on Decimal32.
# `Num` requires `Add + Sub + Mul + Div + Rem`, so this feature
# auto-enables `ops`. Pulls `fmt` because `Num::from_str_radix`
# routes through `parse_str`. Pulls `binary-float` because
# integer-conversion paths route through `f64`.
num-traits = ["fmt", "ops", "binary-float", "dep:num-traits"]
# DPD (Densely Packed Decimal) byte-pattern interchange:
# `Decimal32::to_dpd_bytes` / `from_dpd_bytes`. ferrodec stores the
# BID encoding internally for arithmetic; DPD is the interchange
# encoding used by IBM decNumber, z/Architecture decimal-FP hardware,
# and the upstream `dsEncode.decTest` conformance vectors. The codec
# is pure boolean equations from IEEE 754-2008 §3.5.2 — no lookup
# tables, 2 declets over 4 bytes for the 32-bit format. Off by
# default to preserve the embedded code-size floor. See ADR-0001
# (BID for arithmetic) and ADR-0009 (DPD interchange).
dpd = []

[dependencies]
ferrodec-ieee = { path = "../ferrodec-ieee", version = "0.1.4" }
ferrodec-multiword = { path = "../ferrodec-multiword", version = "0.1.0", optional = true }
ferrodec-transcend = { path = "../ferrodec-transcend", version = "0.1.0", optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
ferrodec-test-support = { path = "../ferrodec-test-support", features = ["transcend-oracle"] }
# Exact cross-check oracle for the arithmetic correctness slice. Every
# finite Decimal32 is exactly representable in Decimal64, so a Decimal32
# op can be checked against the now conformance-validated Decimal64 op
# rounded back to 7 digits. Dev-only: never linked into the no_std
# library build. The workspace graph stays acyclic because Decimal64
# does not depend on Decimal32.
ferrodec-decimal64 = { path = "../ferrodec-decimal64" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1"

[[example]]
name = "money"
required-features = ["fmt"]

[[example]]
name = "rounding_modes"
required-features = ["fmt"]

[[example]]
name = "transcendentals"
required-features = ["transcendentals"]

[lints]
workspace = true

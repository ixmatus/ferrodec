[package]
name = "ferrodec-decimal64"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "no_std IEEE 754-2019 Decimal64 for embedded use, with Kani-verified properties"
repository.workspace = true
keywords = ["decimal", "decimal64", "ieee754", "no_std", "embedded"]
categories = ["embedded", "mathematics", "no-std", "no-std::no-alloc"]

[features]
default = ["fmt"]
# String parse + format. Uses core::fmt::Write, no alloc.
fmt = []
# f64 conversions (Decimal64 ↔ f64). No alloc; routes via the canonical
# decimal-string round-trip. Decimal64 carries 16 digits whereas f64
# only ~15.95, so the round-trip may lose the last Decimal64 digit;
# callers needing full Decimal64 precision should use `parse_str` /
# `Display` instead. Pulls `fmt` for the round-trip path.
binary-float = ["fmt"]
# Transcendental sub-features. The exp-log family
# (`exp` / `ln` / `exp2` / `log2` / `log10`), `cbrt`, the whole trig
# family (`sin` / `cos` / `tan` / `asin` / `acos` / `atan` /
# `atan2`), and the whole hyperbolic family (`sinh` / `cosh` /
# `tanh` / `asinh` / `acosh` / `atanh`) are faithfully rounded
# (≤ 1 ULP at 16 digits, every IEEE 754-2019 rounding direction) via
# the shared `ferrodec-transcend` Extended-precision kernel after the
# fd-r0l train, at exact parity with the `ferrodec` (Decimal128)
# parent; the trig family uses the Payne-Hanek argument reduction, so
# its accuracy is no longer capped at the pre-fd-r0l `|x| < 2^53`
# f64-round-trip limit, and the hyperbolic family is faithful across
# the full Decimal64 magnitude range (the pre-fd-r0l `sinh` / `cosh`
# f64-overflow cap at `|x| ≳ 710` is lifted). The remaining operation
# (pow) still routes through f64 via `libm` (pure Rust,
# no_std-compatible, no FFI); that libm f64 path caps its achievable
# precision at ~10⁻¹⁵ relative, one digit below Decimal64's nominal
# 16. A follow-on can migrate it onto the same pure-decimal kernel
# when needed (public surface is drop-in compatible). Each
# sub-feature pulls in `binary-float`.
#
# `exp-log`     — exp, ln, exp2, log2, log10. Route through the
#                 shared faithful `ferrodec-transcend`
#                 Extended-precision kernel (≤ 1 ULP across the true
#                 Decimal64 domain), not the pre-fd-r0l lossy f64 /
#                 `libm` detour. `dep:libm` is retained because the
#                 `pow` feature (which implies `exp-log`) still
#                 routes through `libm`.
# `trig`        — sin, cos, tan, asin, acos, atan, atan2. Route
#                 through the shared faithful `ferrodec-transcend`
#                 Extended-precision kernel with Payne-Hanek
#                 argument reduction (≤ 1 ULP across the true
#                 Decimal64 domain), not the pre-fd-r0l lossy f64 /
#                 `libm` detour. `dep:libm` is retained because the
#                 `pow` feature still routes through `libm`.
# `hyperbolic`  — sinh, cosh, tanh, asinh, acosh, atanh. Route
#                 through the shared faithful `ferrodec-transcend`
#                 Extended-precision kernel (built on the
#                 already-faithful exp / ln primitives, ≤ 1 ULP
#                 across the true Decimal64 domain), not the
#                 pre-fd-r0l lossy f64 / `libm` detour. Implies
#                 `exp-log`.
# `pow`         — pow (f64 / `libm`), cbrt (faithful shared kernel,
#                 fd-r0l). Implies `exp-log`.
exp-log = ["binary-float", "dep:libm", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/exp-log"]
trig = ["binary-float", "dep:libm", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/trig"]
hyperbolic = ["exp-log", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/hyperbolic"]
pow = ["exp-log", "dep:ferrodec-transcend", "dep:ferrodec-multiword", "ferrodec-transcend/pow"]
# Convenience meta-feature: enable every transcendental at once.
transcendentals = ["trig", "exp-log", "hyperbolic", "pow"]
# `core::ops` operator overloads (Add / Sub / Mul / Div / Rem and the
# *Assign variants, plus Neg). Opt-in: defaults to
# RoundingMode::NearestEven and drops the per-operation Status. Users
# who need explicit rounding-mode or status control should keep using
# the explicit `add` / `sub` / `mul` / `div` / `rem` methods.
ops = []
# Serde Serialize / Deserialize for Decimal64. Round-trips through the
# canonical decimal string by default; the `serde_bid` helper module
# is provided for callers that prefer to serialize the raw 64-bit BID
# pattern in binary formats. Pulls in `fmt` because the default
# representation goes through `parse_str` / `Display`.
serde = ["fmt", "dep:serde"]
# `num-traits` adapter: implements `Zero`, `One`, `Bounded`,
# `Signed`, `Num`, and the `From|To|Primitive` traits on Decimal64.
# `Num` requires `Add + Sub + Mul + Div + Rem`, so this feature
# auto-enables `ops`. Pulls `fmt` because `Num::from_str_radix`
# routes through `parse_str`. Pulls `binary-float` for the
# `ToPrimitive` f32 / f64 conversions. It no longer pulls `dep:libm`:
# after M5 (`eca13ef`) the integer conversions are exact and
# `num_traits_impls.rs` has no `libm` use; `libm` is still pulled
# independently by `exp-log` / `trig` (fd-17, discovered from M5).
num-traits = ["fmt", "ops", "binary-float", "dep:num-traits"]

[dependencies]
ferrodec-ieee = { path = "../ferrodec-ieee", version = "0.1.3" }
ferrodec-multiword = { path = "../ferrodec-multiword", version = "0.1.0", optional = true }
ferrodec-transcend = { path = "../ferrodec-transcend", version = "0.1.0", optional = true }
libm = { version = "0.2", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
ferrodec-test-support = { path = "../ferrodec-test-support", features = ["transcend-oracle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1"
# Transcendental property-test oracle. Pure Rust arbitrary-precision
# float (no MPFR / C FFI), consistent with the embedded ethos
# (feedback_oracle_choice). Dev-only: never linked into the no_std
# library build.
proptest = "1"
astro-float = "0.9"

[[example]]
name = "money"
required-features = ["fmt"]

[[example]]
name = "rounding_modes"
required-features = ["fmt"]

[[example]]
name = "transcendentals"
required-features = ["transcendentals"]

[lints]
workspace = true
